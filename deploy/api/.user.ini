; PHP settings for the API document root (php-fpm / CGI hosts). Mirrors the values in .htaccess.
upload_max_filesize = 6M
post_max_size = 13M
max_file_uploads = 5
memory_limit = 128M
max_execution_time = 60
display_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
